name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Offline checks only: no provider keys, no deployed database, no paid calls. Passing CI is not live evidence.
# Node 24: app and DS tests run .ts directly through Node's built-in type stripping.
jobs:
  checks:
    name: Contracts, module, typecheck, app tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:all
      - name: Generated schemas are current
        run: npm run contracts:schema && git diff --exit-code -- contracts

  ai:
    name: Agents and worker (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ai:check

  build:
    name: Production build (unconfigured mode)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w @dor/contracts && npm run build -w @dor/agents
      - run: npx next build --webpack

  bindings:
    name: Generated SpacetimeDB bindings are current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # The installer cannot pin a version (it always fetches the latest release). Committed bindings
      # were generated with CLI 2.13.0; the version stamp line is ignored by the check, but a newer
      # generator may change output and require regenerating.
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: spacetime --version
      - run: npm run bindings:check -- --require
